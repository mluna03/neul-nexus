<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neul Nexus — Catálogo de Programas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">N</div>
        <span>Neul Nexus</span>
      </div>
      <nav>
        <button data-view="inicio" class="active">Inicio</button>
        <button data-view="catalogo">Catálogo</button>
      </nav>
    </div>
  </header>

  <main>

    <!-- ============ VISTA INICIO ============ -->
    <section id="view-inicio" class="view active">
      <div class="hero">
        <h1>Tu <em>arsenal</em> de programas</h1>
        <p>Accede rápido a tus categorías y a los programas que más buscas. Toca una tarjeta para copiar el enlace de descarga.</p>
      </div>

      <div class="section-head">
        <h2>📂 Categorías</h2>
        <span class="hint">Acceso directo</span>
      </div>
      <div class="categorias-grid" id="categorias-grid"></div>

      <div class="section-head">
        <h2>🔥 Más buscados</h2>
        <span class="hint" id="mas-buscados-hint">Tus programas más consultados</span>
      </div>
      <div class="programas-grid" id="mas-buscados-grid"></div>
    </section>

    <!-- ============ VISTA CATÁLOGO ============ -->
    <section id="view-catalogo" class="view">
      <div class="section-head" style="margin-top:0">
        <h2>📦 Catálogo completo</h2>
        <span class="hint" id="contador-programas"></span>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="text" id="buscador" placeholder="Buscar programa...">
        </div>
        <div class="filtros" id="filtros"></div>
      </div>

      <div class="programas-grid" id="catalogo-grid"></div>
    </section>

  </main>

  <div id="toast">
    <span class="check">✓</span>
    <span id="toast-text"></span>
  </div>

  <footer>
    <strong>Neul Nexus</strong> · Catálogo personal · <span id="year"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
